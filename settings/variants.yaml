normalization:
  input:
    - ":: NFKC ();"
    - ":: lower ()"
    - ":: Hans-Hant"
    - "ß > 'ss'"
variants:
  - type: lexical
    rules:
        - /FILE/ variants/variants-bg.yaml
        - /FILE/ variants/variants-ca.yaml
        - /FILE/ variants/variants-cs.yaml
        - /FILE/ variants/variants-da.yaml
        - /FILE/ variants/variants-de.yaml
        - /FILE/ variants/variants-el.yaml
        - /FILE/ variants/variants-en.yaml
        - /FILE/ variants/variants-es.yaml
        - /FILE/ variants/variants-et.yaml
        - /FILE/ variants/variants-eu.yaml
        - /FILE/ variants/variants-fi.yaml
        - /FILE/ variants/variants-fr.yaml
        - /FILE/ variants/variants-gl.yaml
        - /FILE/ variants/variants-hu.yaml
        - /FILE/ variants/variants-it.yaml
        - /FILE/ variants/variants-mg.yaml
        - /FILE/ variants/variants-ms.yaml
        - /FILE/ variants/variants-nl.yaml
        - /FILE/ variants/variants-no.yaml
        - /FILE/ variants/variants-pl.yaml
        - /FILE/ variants/variants-pt.yaml
        - /FILE/ variants/variants-ro.yaml
        - /FILE/ variants/variants-ru.yaml
        - /FILE/ variants/variants-sk.yaml
        - /FILE/ variants/variants-sl.yaml
        - /FILE/ variants/variants-sv.yaml
        - /FILE/ variants/variants-tr.yaml
        - /FILE/ variants/variants-uk.yaml
        - /FILE/ variants/variants-vi.yaml
  - type: mutation
    mode: append
    scope: global
    rules:
      - lang: de
        mutations:
            - pattern: '([äöü])'
              replacement: '\1e'
      - mutations:
            - pattern: "`"
              replacement: " "
